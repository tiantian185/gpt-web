</style></head><body><div id="app" aria-live="off"></div><script>window.QUIZ_CONFIG={"mode":"roast","pill":"整蛊娱乐 · 20题","title":"李苛傻逼鉴定局","brand":"LIKÉ / SB","nav":"傻逼鉴定","hero_kicker":"UNOFFICIAL IDIOT REPORT / 02","hero_top":"你真的没问题？","hero_bottom":"先鉴定再嘴硬。","hero_desc":"你以为自己是清醒旁观者，结果别人眼里你可能正在稳定输出。选择最符合你的答案，鉴定系统会毫不客气。","cta":"开始鉴定","cta_resume":"继续上次鉴定","question_kicker":"别装，按第一反应选","result_kicker":"SB IDENTIFICATION / 盖章完成","result_sub":"本局宣布：你的离谱有迹可循。以下是本次鉴定报告。","result_badge":"傻逼认证 · 仅供损友互怼","share_label":"转发我的鉴定书","poster_label":"保存傻逼鉴定书","next_label":"装正经，测人格","footer_note":"纯属虚构的朋友间整蛊问卷，量表名、分数和“鉴定结果”都没有科学或医学效力。请勿用于攻击、骚扰或评价现实中的他人。","questions":[["H","别人一给我点好脸色，我脑子里已经开始续写剧情。",1],["Z","越是在意，我越爱表现得“无所谓”。",1],["N","一句“行吧”能让我复盘半小时。",1],["F","明知道不值得，我也可能再给一次机会。",1],["H","有好感时，我基本能控制住自己的期待。",-1],["Z","我能大大方方承认自己吃醋或者在意。",-1],["N","别人迟回消息，我从不脑补出一整部连续剧。",-1],["F","踩过一次坑，我通常不会再踩第二次。",-1],["H","一个小细节就足够让我快乐一整天。",1],["Z","我说“随便”，其实心里早有标准答案。",1],["N","半夜突然想起自己白天讲错的一句话。",1],["F","对方只要态度好一点，我就容易心软。",1],["H","我经常因为一时上头做出后来想撤回的决定。",1],["Z","我喜欢嘴上说着不管，手上偷偷关注。",1],["N","我会反复想别人一句话里有没有隐藏意思。",1],["F","劝别人及时止损时我很果断，轮到自己就犹豫。",1],["H","我能把一次普通互动理解成某种特殊信号。",1],["Z","即使先想联系，我也可能等对方先开口。",1],["N","我常常在事情还没发生前就先替自己担心。",1],["F","我会为了一个不确定的回应，忍不住继续投入。",1]],"dims":[["H","上头指数","脑子比现实走得快多少"],["Z","嘴硬系数","到底多少话被你咽回去"],["N","内耗浓度","在脑海里给自己加多少戏"],["F","犯贱水平","明知有坑还想再探头看看"]],"types":[{"id":"ultimate","name":"纯种傻逼李苛","tagline":"四项全能，稳定发挥，毫无短板。","prototype":[93,89,92,91],"description":"你的问题从来不是不知道哪里不对。很多次你都在心里把利弊算得明明白白，下一秒又凭一句“万一呢”把结果全部推翻。明明给朋友出主意时像个军师，轮到自己就直接把脑子托管给情绪。","strength":"优点是感情丰富，缺点是丰富到经常溢出来。","blind":"你最擅长的运动：反复在同一个坑里完成高难度跳水。","advice":"每天提醒自己一次：嘴可以硬，脑子别跟着下线。"},{"id":"simp","name":"犯贱型李苛","tagline":"道理全懂，回头照冲。","prototype":[68,48,64,96],"description":"你说你要及时止损，结果只要对方来一点动静，就又开始认真分析“是不是还有机会”。你并非没有底线，只是底线经常临时搬家。别人问你图什么，你也很难解释，反正先图个不死心。","strength":"你真的很有耐心，耐心到让人怀疑是不是没有痛觉。","blind":"别人随手给出的台阶，你能自己修成一整座楼梯。","advice":"给你一个建议：删除“再看看”，改成“看过了，不看了”。"},{"id":"hardmouth","name":"嘴硬型李苛","tagline":"全身上下，嘴是最硬的。","prototype":[61,96,54,50],"description":"你嘴上说着“无所谓”“谁在乎”，转头就会盯着某个细节反复琢磨。你极其擅长装作从容，只可惜表演对象通常是自己。别人未必看穿了，但你的浏览记录和聊天框大概已经招了。","strength":"表面气场充足，至少嘴上从没输过。","blind":"明明想要一个回应，偏偏要把自己演成不需要回应。","advice":"下次想说“没事”的时候，先检查你是不是真的没事。"},{"id":"delulu","name":"自我攻略型李苛","tagline":"对方只发了句早，你已经脑补到婚礼。","prototype":[97,40,73,62],"description":"你特别擅长从一点点日常互动里提炼出含糖量极高的剧情。理性上知道不能想太多，情绪上却已经抢先开了十几个分支结局。现实进度条还在 3%，你心里的片尾曲都快放完了。","strength":"想象力一流，普通日子也能过出连续剧的情绪价值。","blind":"你最容易爱上的，偶尔是自己想象中的那个版本。","advice":"对方说了什么算证据，你想了什么不算。"},{"id":"switch","name":"反复横跳型李苛","tagline":"早上想通了，晚上又想不通。","prototype":[81,63,86,74],"description":"你的一天可以完成三次彻底放下、两次重新上头，以及一次“算了再看看”。你不是没有原则，只是每隔几个小时就会给原则开一次内部会议。最离谱的是，每次你都觉得这次真想明白了。","strength":"适应力确实不错，情绪每换一套剧本你都能跟上。","blind":"你以为自己在反复权衡，其实有时只是在给旧决定换包装。","advice":"重大决定不要在上头时做，也别在深夜推翻白天的自己。"},{"id":"overthink","name":"高敏内耗型李苛","tagline":"别人还没说话，你已经把自己说服又说崩了。","prototype":[44,59,98,55],"description":"你能从一句平平无奇的话里发现七种潜台词，然后为其中最坏的一种提前伤心。你的脑子永远在加班，问题是多数任务并没有人真的下单。别人以为你很平静，其实你在心里已经写完一份长达二十页的事故报告。","strength":"观察细致，细致到能担任人际关系显微镜。","blind":"别人一句话只有八个字，你可以给它配八千字的阅读理解。","advice":"缺乏证据的时候，禁止给自己判刑。"},{"id":"rebel","name":"一身反骨型李苛","tagline":"好好的建议你不听，弯路必须亲自走。","prototype":[58,87,34,76],"description":"你可能早就知道哪条路更省事，但只要别人语气一像在教育你，你就想亲自证明点什么。你表面说要自由，实际上偶尔被自己的犟劲牵着鼻子走。最后绕了一大圈回来，还要补一句“我本来也这么想”。","strength":"不轻易随波逐流，也确实敢为自己的选择买单。","blind":"有时坚持的不是正确答案，只是那句“不服”。","advice":"承认别人说得对不丢人，绕路绕到导航重算才丢人。"},{"id":"clearish","name":"间歇清醒型李苛","tagline":"大多数时候脑子在线，关键时刻突然掉线。","prototype":[28,28,42,48],"description":"平时你看别人的问题简直一眼到位，甚至还能精准指出所有风险。但生活总会给你安排一个例外，让你亲手演示什么叫“我以为我不会”。好消息是你很快就能清醒；坏消息是清醒之前往往已经做完了。","strength":"有一定自省能力，出事后复盘速度快。","blind":"你的人生经验不少，只是偶尔不肯调用缓存。","advice":"没关系，下次先调用大脑，再调用勇气。"}],"intro_points":["四种离谱体质","20道灵魂拷问","100%娱乐性质"],"axis_copy":{"H":["你表面上还算理性","你经常先于现实完成上头"],"Z":["你通常愿意直接说","你的嘴比实情更能硬撑"],"N":["脑内相对清净","你一天能给自己加三场戏"],"F":["及时止损能力尚可","你主打一个越劝越往前冲"]}};</script><script>
(()=>{
'use strict';
const config=window.QUIZ_CONFIG;
const mode=config.mode;
const app=document.querySelector('#app');
const storageKey=`li-ke-quiz-${mode}-v2`;
const COUNT=config.questions.length;
const LABELS= mode==='serious'
 ? ['非常不同意','比较不同意','不确定','比较同意','非常同意']
 : ['根本不是我','有点但不多','好像是这样','确实，别骂了','你监控我？'];
let answers=Array(COUNT).fill(null);
let step=0;
let activeResult=null;
let toastTimeout=null;

const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadDraft(){
 try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');
 if(saved&&Array.isArray(saved.answers)&&saved.answers.length===COUNT){
  answers=saved.answers.map(x=>Number.isInteger(x)&&x>=1&&x<=5?x:null);
  step=Math.min(COUNT-1,Math.max(0,Number(saved.step)||0));
 }}catch(e){}
}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({answers,step}));}catch(e){}}
function cleanHash(){if(location.hash)history.replaceState(null,'',location.pathname+location.search);}
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});}
function shell(main){
 app.innerHTML=`<div class="site-shell"><header class="site-header">
 <a class="wordmark" href="../index.html" aria-label="返回测试首页"><span class="brand-symbol">L<span class="brand-dot">.</span></span><span>${escapeHTML(config.brand)}</span></a>
 <nav aria-label="页面导航"><span class="nav-tag">${escapeHTML(config.nav)}</span><a class="nav-link" href="${mode==='serious'?'../roast/':'../serious/'}">${mode==='serious'?'去傻逼鉴定':'去人格侧写'} <span aria-hidden="true">↗</span></a></nav></header>
 <main id="main-content">${main}</main><footer class="footer"><span>© LIKÉ PLAYGROUND / 2026</span><span>${mode==='serious'?'观察自己，不急着定义自己。':'大家笑一笑，别认真对号入座。'}</span></footer></div>`;
}
function showToast(str){
 let n=document.querySelector('.toast'); if(!n){n=document.createElement('div');n.className='toast';n.setAttribute('role','status');document.body.appendChild(n)}
 n.textContent=str;n.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>n.classList.remove('show'),2700);
}
function landing(){
 activeResult=null;document.title=config.title+' · 免费互动测试';
 const hasDraft=answers.some(x=>x!==null);
 const heroGraphic=mode==='serious'?`<div class="hero-graphic serious-graphic" aria-hidden="true"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="orbit orbit-three"></div><div class="orbit-center"><span>SELF</span><strong>01</strong></div><span class="point point-a"></span><span class="point point-b"></span><span class="point point-c"></span><div class="graphic-caption">OBSERVE · REFLECT · UNDERSTAND</div></div>`:`<div class="hero-graphic roast-graphic" aria-hidden="true"><div class="stamp-outline"><div class="stamp-top">CERTIFIED</div><div class="stamp-sb">SB<span>!</span></div><div class="stamp-bottom">李苛鉴定局专用章</div></div><span class="sticker st-a">别装了</span><span class="sticker st-b">99% 嘴硬*</span><span class="asterisk">*虚构梗，不是统计数据</span></div>`;
 shell(`<section class="hero section-enter"><div class="hero-copy"><div class="eyebrow"><span class="small-marker"></span>${escapeHTML(config.hero_kicker)}</div>
 <h1>${escapeHTML(config.hero_top)}<br><em>${escapeHTML(config.hero_bottom)}</em></h1><p class="hero-description">${escapeHTML(config.hero_desc)}</p>
 <div class="hero-actions"><button id="start-btn" class="btn btn-primary"><span>${hasDraft?escapeHTML(config.cta_resume):escapeHTML(config.cta)}</span><span aria-hidden="true">↗</span></button>${hasDraft?'<button id="restart-btn" class="btn btn-outline">重新开始</button>':''}</div>
 <div class="hero-micro"><span class="micro-dot"></span><span>无需登录</span><span class="micro-separator">/</span><span>不上传答题记录</span><span class="micro-separator">/</span><span>约 ${mode==='serious'?'3':'2'} 分钟</span></div></div>${heroGraphic}</section>
 <section class="info-strip" aria-label="测试信息"><div class="info-intro"><div class="info-number">${COUNT}<span>Q</span></div><div><strong>一场关于自己的小实验</strong><p>${escapeHTML(config.pill)}</p></div></div><div class="info-features">${config.intro_points.map((a,i)=>`<div><span class="feature-index">0${i+1}</span><span>${escapeHTML(a)}</span></div>`).join('')}</div></section>
 <div class="method-note"><span class="note-sign">i</span><span>${escapeHTML(config.footer_note)}</span></div>`);
 document.querySelector('#start-btn').onclick=()=>{if(!hasDraft){answers=Array(COUNT).fill(null);step=0;}questionView();scrollToTop()};
 const restart=document.querySelector('#restart-btn');if(restart)restart.onclick=()=>{resetQuiz();questionView();scrollToTop()};
}
function resetQuiz(){answers=Array(COUNT).fill(null);step=0;cleanHash();persist()}
function questionView(){
 document.title=`第 ${step+1} 题 · ${config.title}`;
 const q=config.questions[step];
 const answered=answers.filter(x=>x!==null).length;
 const thisAns=answers[step];
 const percent=Math.round(answered/COUNT*100);
 shell(`<section class="question-layout section-enter">
 <aside class="question-sidebar"><div class="eyebrow"><span class="small-marker"></span>QUESTIONNAIRE / ${String(step+1).padStart(2,'0')}</div>
 <p class="sidebar-title">按真实的你回答<br>不必选“正确答案”</p><div class="side-progress"><div class="progress-big">${String(step+1).padStart(2,'0')}<span> / ${COUNT}</span></div><div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div><div class="progress-copy">已完成 ${answered} 题 · ${percent}%</div></div><div class="sidebar-small">${mode==='serious'?'没有标准答案。请以你多数时候的习惯为准。':'没有正确答案，装得越像，鉴定越离谱。'}</div>
 <button id="exit-btn" class="text-link">← 返回测试首页</button></aside>
 <div class="question-panel"><div class="question-top"><span>${escapeHTML(config.question_kicker)}</span><span>${String(step+1).padStart(2,'0')} / ${COUNT}</span></div>
 <div class="question-content"><div class="question-counter">${mode==='serious'?'陈述':'灵魂拷问'} <b>${String(step+1).padStart(2,'0')}</b></div><h2>${escapeHTML(q[1])}</h2>
 <fieldset class="options" aria-label="请选择最符合你的选项"><legend class="sr-only">同意程度</legend>${LABELS.map((label,i)=>`<button type="button" class="option ${thisAns===i+1?'chosen':''}" data-value="${i+1}" aria-pressed="${thisAns===i+1}"><span class="option-digit">0${i+1}</span><span>${escapeHTML(label)}</span><span class="option-circle" aria-hidden="true">${thisAns===i+1?'✓':''}</span></button>`).join('')}</fieldset>
 <p class="keyboard-tip">键盘可按数字 1–5 快速选择</p></div>
 <div class="question-bottom"><button id="prev-btn" class="btn btn-outline" ${step===0?'disabled':''}>← 上一题</button><button id="next-btn" class="btn btn-primary" ${thisAns===null?'disabled':''}>${step===COUNT-1?'生成鉴定报告':'下一题'} <span aria-hidden="true">→</span></button></div></div></section>`);
 document.querySelectorAll('[data-value]').forEach(el=>el.onclick=()=>{answers[step]=Number(el.dataset.value);persist();questionView()});
 document.querySelector('#exit-btn').onclick=()=>{landing();scrollToTop()};
 document.querySelector('#prev-btn').onclick=()=>{if(step>0){step--;persist();questionView();scrollToTop()}};
 document.querySelector('#next-btn').onclick=()=>{
  if(answers[step]===null)return;
  if(step===COUNT-1){const s=scoreAnswers();if(s){activeResult=makeResult(s);showResult(activeResult);scrollToTop()}else showToast('还有未完成的题目');}
  else{step++;persist();questionView();scrollToTop()}
 };
}
function scoreAnswers(){
 if(answers.some(x=>x===null))return null;
 const out={};
 config.dims.forEach(([key])=>{
  const items=config.questions.map((q,i)=>({q,i})).filter(({q})=>q[0]===key);
  const normalized=items.map(({q,i})=>(q[2]===1?answers[i]:6-answers[i]));
  const raw=(normalized.reduce((a,b)=>a+b,0)/items.length-1)*25;
  out[key]=Math.max(0,Math.min(100,Math.round(raw)));
 });return out;
}
function makeResult(scores){
 const keys=config.dims.map(d=>d[0]);
 // Euclidean profile matching, shared across all variants, with a stable tiny tie breaker.
 const ranked=config.types.map(t=>({...t,distance:keys.reduce((sum,k,i)=>sum+(scores[k]-t.prototype[i])**2,0)})).sort((a,b)=>a.distance-b.distance);
 const sorted=keys.map(k=>({key:k,val:scores[k],name:config.dims.find(d=>d[0]===k)[1]})).sort((a,b)=>b.val-a.val);
 return{scores,type:ranked[0],ranked,sorted};
}
function radarSVG(scores){
 const keys=config.dims.map(d=>d[0]);const center=130;const maxRadius=83;
 const coords=(ratio)=>keys.map((k,i)=>{const a=-Math.PI/2+i*2*Math.PI/keys.length;return [center+Math.cos(a)*maxRadius*ratio*(typeof ratio==='number'?1:1),center+Math.sin(a)*maxRadius*ratio]});
 const pts=vals=>vals.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
 const web=[.25,.5,.75,1].map(x=>`<polygon points="${pts(coords(x))}" class="radar-web"/>`).join('');
 const vectors=keys.map((k,i)=>{const a=-Math.PI/2+i*Math.PI/2;return `<line x1="130" y1="130" x2="${130+Math.cos(a)*maxRadius}" y2="${130+Math.sin(a)*maxRadius}" class="radar-axis"/>`}).join('');
 const data=keys.map((k,i)=>{const a=-Math.PI/2+i*Math.PI/2;const r=Math.max(0.06,scores[k]/100)*maxRadius;return[130+Math.cos(a)*r,130+Math.sin(a)*r]});
 const dots=data.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" class="radar-dot"/>`).join('');
 const names=config.dims.map((d,i)=>{const a=-Math.PI/2+i*Math.PI/2;return `<text x="${130+Math.cos(a)*112}" y="${136+Math.sin(a)*110}" text-anchor="middle" class="radar-label">${d[1]}</text>`}).join('');
 return `<svg class="radar" width="100%" viewBox="0 0 260 260" role="img" aria-label="四个测试维度的雷达图">${web}${vectors}<polygon points="${pts(data)}" class="radar-shape"/>${dots}${names}</svg>`;
}
function scoreLine(key,v){const [,name,description]=config.dims.find(d=>d[0]===key);return `<div class="metric"><div class="metric-header"><span>${escapeHTML(name)}<small>${escapeHTML(description)}</small></span><strong>${v}<small>/100</small></strong></div><div class="metric-track"><div class="metric-fill" style="width:${v}%"></div></div></div>`;}
function dynamicLine(result){
 const top=result.sorted[0],low=result.sorted[result.sorted.length-1];
 const phrasing=item=>item.val>=60?config.axis_copy[item.key][1]:item.val<=40?config.axis_copy[item.key][0]:`你在${item.name}方面的表现比较灵活`;
 return `在本次作答中，${top.name}是你相对突出的维度（${top.val}/100），${low.name}相对靠后（${low.val}/100）。这可能意味着：${phrasing(top)}；同时，${phrasing(low)}。`;
}
function reportId(result){const v=config.dims.map(d=>result.scores[d[0]]).join('');let hash=7;for(const ch of v+result.type.id)hash=(hash*31+ch.charCodeAt(0))%100000;return String(hash).padStart(5,'0')}
function showResult(result){
 activeResult=result;
 document.title=`${result.type.name} · ${config.title}`;
 const t=result.type,s=result.scores;
 const stamp=mode==='roast'?`<div class="result-stamp" aria-hidden="true">SB<br><small>PASS</small></div>`:'';
 const metricRows=config.dims.map(([key])=>scoreLine(key,s[key])).join('');
 shell(`<section class="result-hero section-enter"><div class="result-topline"><span>${escapeHTML(config.result_kicker)}</span><span>REPORT #${reportId(result)}</span></div>
 <div class="result-main"><div><span class="result-badge">${escapeHTML(config.result_badge)}</span><p class="result-overline">${mode==='roast'?'鉴定完成：你也是傻逼李苛的一种':'经本次答题，你的画像更接近'}</p><h1>${escapeHTML(t.name)}</h1><h2>${escapeHTML(t.tagline)}</h2><p class="result-intro">${escapeHTML(config.result_sub)}</p></div>${stamp}<div class="result-index" aria-hidden="true">${mode==='serious'?'PROFILE':'SB?'}</div></div></section>
 <section class="result-grid"><article class="result-story"><div class="card-heading"><span>01 / 人格解读</span><span>WHAT THIS SAYS</span></div>
 <p class="story-lead">${escapeHTML(t.description)}</p><p class="story-personal">${escapeHTML(dynamicLine(result))}</p>
 <div class="insight-grid"><div><span class="insight-label">你的优势</span><p>${escapeHTML(t.strength)}</p></div><div><span class="insight-label">容易踩的坑</span><p>${escapeHTML(t.blind)}</p></div></div><div class="insight-advice"><span>给你的建议</span><p>${escapeHTML(t.advice)}</p></div></article>
 <article class="result-metrics"><div class="card-heading"><span>02 / 四维指数</span><span>4 AXES / 100</span></div><div class="radar-wrap">${radarSVG(s)}</div><div class="metric-list">${metricRows}</div><p class="metric-note">分数只表示你在本次题目中的作答倾向，非人群排名，也不是医学或心理诊断。</p></article></section>
 <section class="result-actions"><div><strong>${mode==='serious'?'你认识这样的自己吗？':'被鉴定了，就别藏着了。'}</strong><p>${mode==='serious'?'分享给朋友看看，你们会不会看到不一样的彼此。':'发给损友，看看到底谁才是李苛中的李苛。'}</p></div>
 <div class="action-buttons"><button class="btn btn-primary" id="share-btn">${escapeHTML(config.share_label)} ↗</button><button class="btn btn-outline" id="save-btn">${escapeHTML(config.poster_label)} ↓</button><button class="btn btn-soft" id="redo-btn">重新测试</button><a class="btn btn-subtle" href="${mode==='serious'?'../roast/':'li-ke-personality.html'}">${escapeHTML(config.next_label)} →</a></div></section>
 <div class="method-note"><span class="note-sign">i</span><span>${escapeHTML(config.footer_note)}</span></div>`);
 document.querySelector('#share-btn').onclick=shareResult;
 document.querySelector('#save-btn').onclick=()=>savePoster(result);
 document.querySelector('#redo-btn').onclick=()=>{resetQuiz();questionView();scrollToTop()};
}
function shareURL(result){
 const values=config.dims.map(d=>result.scores[d[0]]);
 return location.href.split('#')[0]+'#r='+values.join('-');
}
async function shareResult(){
 if(!activeResult)return;
 const summary=`${mode==='serious'?'我的人格侧写':'傻逼鉴定结果'}：${activeResult.type.name}\n${activeResult.type.tagline}`;
 const link=location.protocol==='file:'?'':('\n'+shareURL(activeResult));
 const message=summary+link;
 try{if(navigator.share&&location.protocol!=='file:'){await navigator.share({title:config.title,text:summary,url:shareURL(activeResult)});return}}catch(e){if(e.name==='AbortError')return;}
 try{await navigator.clipboard.writeText(message);showToast(location.protocol==='file:'?'已复制结果文字。部署上线后可分享结果链接。':'结果文字与链接已复制');}
 catch(e){const ta=document.createElement('textarea');ta.value=message;ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast('已复制结果文字')}catch(err){showToast('复制失败，请截图分享')}ta.remove()}
}
function wrapCanvas(ctx,str,x,y,maxWidth,lineHeight,maxLines=10){
 const chars=[...str];let line='';let lines=0;
 for(const ch of chars){const candidate=line+ch;
  if(ctx.measureText(candidate).width>maxWidth&&line){ctx.fillText(line,x,y);y+=lineHeight;lines++;line=ch;if(lines>=maxLines)return y;}
  else line=candidate;
 }
 if(line){ctx.fillText(line,x,y);y+=lineHeight}return y;
}
function savePoster(result){
 const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1500;
 const ctx=canvas.getContext('2d');if(!ctx){showToast('当前浏览器不支持保存图片');return}
 const isRoast=mode==='roast';const bg=isRoast?'#fbe652':'#f0f4ef',ink='#142425',accent=isRoast?'#151515':'#246a67';
 ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1500);ctx.fillStyle=accent;ctx.fillRect(0,0,1080,19);
 ctx.fillStyle=ink;ctx.font='bold 29px "Microsoft YaHei",sans-serif';ctx.fillText(config.brand,78,94);
 ctx.font='23px "Microsoft YaHei",sans-serif';ctx.fillText(isRoast?'UNOFFICIAL IDIOT REPORT':'PERSONALITY PROFILE',78,145);
 ctx.fillStyle=isRoast?'#fff4b3':'#e0e9e4';ctx.fillRect(64,206,952,323);
 ctx.fillStyle=ink;ctx.font='24px "Microsoft YaHei",sans-serif';ctx.fillText('经本次测试，你的结果是',98,267);
 ctx.font='bold 69px "Microsoft YaHei",sans-serif';wrapCanvas(ctx,result.type.name,95,367,855,83,2);
 ctx.font='30px "Microsoft YaHei",sans-serif';wrapCanvas(ctx,result.type.tagline,98,455,835,40,2);
 ctx.font='bold 29px "Microsoft YaHei",sans-serif';ctx.fillText('你的四维指数',79,615);
 config.dims.forEach(([key,name],i)=>{const y=685+i*113;ctx.fillStyle=ink;ctx.font='26px "Microsoft YaHei",sans-serif';ctx.fillText(name,78,y);ctx.font='bold 27px "Microsoft YaHei",sans-serif';ctx.textAlign='right';ctx.fillText(result.scores[key]+'/100',990,y);ctx.textAlign='left';ctx.fillStyle=isRoast?'#ded1a0':'#d5deda';ctx.fillRect(78,y+23,914,13);ctx.fillStyle=accent;ctx.fillRect(78,y+23,914*result.scores[key]/100,13)});
 ctx.fillStyle=ink;ctx.font='bold 29px "Microsoft YaHei",sans-serif';ctx.fillText('专属侧写',78,1166);
 ctx.font='25px "Microsoft YaHei",sans-serif';wrapCanvas(ctx,result.type.description,78,1219,922,42,4);
 ctx.fillStyle=accent;ctx.fillRect(78,1413,925,2);ctx.font='22px "Microsoft YaHei",sans-serif';ctx.fillText(isRoast?'整蛊测试 · 本结果不具诊断效力':'自我观察问卷 · 本结果不具诊断效力',78,1454);
 const a=document.createElement('a');a.download=(isRoast?'傻逼鉴定书-':'人格侧写-')+result.type.name+'.png';a.href=canvas.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();showToast('结果长图已生成');
}
function tryOpenSharedResult(){
 const raw=new URLSearchParams(location.hash.replace(/^#/,'' )).get('r');if(!raw)return false;
 const values=raw.split('-').map(Number);
 if(values.length!==config.dims.length||values.some(v=>!Number.isInteger(v)||v<0||v>100))return false;
 const scores=Object.fromEntries(config.dims.map((d,i)=>[d[0],values[i]]));
 showResult(makeResult(scores));return true;
}
window.addEventListener('keydown',e=>{
 if(!document.querySelector('.question-panel')||e.altKey||e.ctrlKey||e.metaKey)return;
 if(/^[1-5]$/.test(e.key)){const idx=Number(e.key);answers[step]=idx;persist();questionView()}
 else if(e.key==='Enter'&&answers[step]!==null){e.preventDefault();document.querySelector('#next-btn')?.click()}
 else if(e.key==='ArrowLeft'&&step>0){document.querySelector('#prev-btn')?.click()}
});
window.addEventListener('hashchange',()=>{if(!tryOpenSharedResult())landing()});
loadDraft();if(!tryOpenSharedResult())landing();
})();
</script></body></html>
